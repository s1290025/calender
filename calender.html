<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Calendar</title>
<style>
:root{--ink:#20332a;--muted:#68736c;--line:#d8ddd9;--paper:#f4f1e9;--accent:#d66b45}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit}button{color:inherit}.topbar{height:72px;padding:0 3vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#faf9f5}.brand{font-family:Georgia,serif;font-size:18px;font-weight:700;letter-spacing:.08em}.brand span{margin-left:7px;color:var(--accent);font:700 10px sans-serif;letter-spacing:.2em}.save{border:0;border-radius:6px;background:var(--ink);color:#fff;padding:12px 22px;font-weight:700;cursor:pointer}.workspace{min-height:calc(100vh - 72px);display:grid;grid-template-columns:minmax(320px,430px) 1fr}.controls{padding:50px clamp(28px,4vw,62px);background:#faf9f5;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.2em}h1{margin:0;font-family:"Yu Mincho",serif;font-size:clamp(29px,3vw,42px);font-weight:600;line-height:1.4}.intro{margin:16px 0 0;color:var(--muted);font-size:13px;line-height:1.9}.label,.controls label{display:block;margin-bottom:9px;font-size:12px;font-weight:700}.upload{width:100%;min-height:82px;display:flex;align-items:center;justify-content:center;gap:14px;border:1px dashed #a8b2aa;border-radius:8px;background:#f4f4ef;cursor:pointer}.uploadIcon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-size:21px}.upload strong,.upload small{display:block;text-align:left}.upload small{margin-top:4px;color:#8b928d;font-size:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two input,.two select{width:100%;height:43px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:#fff}.rangeHead,.switchRow,.colorRow{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}.rangeHead label{margin:0}.rangeHead span{color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}.segment{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;background:#e8e9e4;border-radius:6px}.segment button{padding:8px;border:0;border-radius:4px;background:transparent;font-size:11px;cursor:pointer}.segment button.active{background:#fff;box-shadow:0 1px 4px #0001}.switch{width:42px;height:24px;padding:3px;border:0;border-radius:20px;background:#c8cec9;cursor:pointer}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(18px)}.colorRow{justify-content:flex-start;gap:12px}.colorRow label{margin:0 auto 0 0}.previewArea{padding:50px clamp(28px,5vw,80px);background:#e8e9e4;display:flex;flex-direction:column;justify-content:center}.previewHeader{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}.previewHeader h2{margin:0;font-family:"Yu Mincho",serif;font-size:22px;font-weight:600}.nav{display:flex;gap:7px}.nav button{width:36px;height:36px;border:1px solid #c8cec9;border-radius:50%;background:#f6f5ef;cursor:pointer}.calendar{position:relative;aspect-ratio:1.414/1;overflow:hidden;background:#7f8d83 center/cover;border-radius:3px;box-shadow:0 20px 55px #27372c25}.shade{position:absolute;inset:0;background:#000}.content{position:absolute;inset:0;padding:5.5% 6.5%;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 5px #0005}.title small,.title strong{display:block}.title small{font-size:clamp(11px,1.3vw,20px);font-weight:700}.title strong{margin:0 0 4%;font-family:"Yu Mincho",serif;font-size:clamp(35px,5vw,78px);line-height:1.05}.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid;border-left:1px solid}.weekday,.day{border-right:1px solid;border-bottom:1px solid}.weekday{padding:1.5% 3%;text-align:center;font-size:clamp(8px,1vw,14px);font-weight:700}.day{min-height:clamp(34px,5.2vw,78px);padding:5%;font-size:clamp(9px,1.2vw,17px)}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#e7ece8;font-size:12px}.hint{margin:15px 0 0;color:#778079;text-align:center;font-size:10px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.previewArea{padding:36px 18px 48px}.topbar{padding:0 18px}.brand span{display:none}.day{min-height:9vw}}
</style></head><body>
<header class="topbar"><div class="brand">PHOTO CALENDAR <span>STUDIO</span></div><button class="save" id="save">PNGで保存</button></header>
<div class="workspace"><aside class="controls"><div><p class="eyebrow">STEP 01</p><h1>写真から、<br>私だけのカレンダーを。</h1><p class="intro">お気に入りの一枚を選んで、すぐにカレンダーを作れます。写真は外部に送信されません。</p></div>
<section><label class="label">背景写真</label><input hidden id="file" type="file" accept="image/*"><button class="upload" id="upload"><span class="uploadIcon">＋</span><span><strong id="uploadText">写真を選ぶ</strong><small>JPG・PNG・WEBP</small></span></button></section>
<section class="two"><label>年<input id="year" type="number"></label><label>月<select id="month"></select></label></section>
<section><div class="rangeHead"><label>写真の暗さ</label><span id="shadeValue">28%</span></div><input id="shade" type="range" min="0" max="70" value="28"></section>
<section><label class="label">写真の位置</label><div class="segment"><button data-pos="top">上</button><button data-pos="center" class="active">中央</button><button data-pos="bottom">下</button></div></section>
<section class="switchRow"><span>月曜日から始める</span><button class="switch" id="monday" aria-label="週の開始曜日を変更"><i></i></button></section>
<section class="colorRow"><label>文字色</label><input id="color" type="color" value="#ffffff"><span id="colorValue">#FFFFFF</span></section></aside>
<section class="previewArea"><div class="previewHeader"><div><p class="eyebrow">PREVIEW</p><h2>仕上がりイメージ</h2></div><div class="nav"><button id="prev" aria-label="前の月">←</button><button id="next" aria-label="次の月">→</button></div></div>
<div class="calendar" id="calendar"><div class="shade" id="shadeLayer"></div><div class="empty" id="empty">写真を選ぶと、ここに表示されます</div><div class="content" id="content"><div class="title"><small id="titleYear"></small><strong id="titleMonth"></strong></div><div class="grid" id="grid"></div></div></div><p class="hint">保存画像は横1600 × 縦1131px。印刷にも使いやすいA判比率です。</p></section></div>
<script>
const M=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],W=["日","月","火","水","木","金","土"];let now=new Date(),year=now.getFullYear(),month=now.getMonth(),monday=false,pos="center",img=null;const $=s=>document.querySelector(s),grid=$("#grid"),cal=$("#calendar");M.forEach((m,i)=>$("#month").add(new Option(m,i)));$("#year").value=year;$("#month").value=month;
function data(){let first=new Date(year,month,1).getDay(),off=monday?(first+6)%7:first,days=new Date(year,month+1,0).getDate(),a=Array(off).fill(null);for(let i=1;i<=days;i++)a.push(i);while(a.length%7)a.push(null);return a}
function render(){let labels=monday?[...W.slice(1),W[0]]:W,cells=data();$("#year").value=year;$("#month").value=month;$("#titleYear").textContent=year;$("#titleMonth").textContent=M[month];grid.innerHTML=labels.map(x=>`<div class="weekday">${x}</div>`).join("")+cells.map(x=>`<div class="day">${x||""}</div>`).join("")}
$("#upload").onclick=()=>$("#file").click();$("#file").onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);cal.style.backgroundImage=`url(${url})`;$("#empty").style.display="none";$("#uploadText").textContent="写真を変更";img=new Image;img.src=url};$("#year").onchange=e=>{year=+e.target.value;render()};$("#month").onchange=e=>{month=+e.target.value;render()};$("#shade").oninput=e=>{$("#shadeValue").textContent=e.target.value+"%";$("#shadeLayer").style.opacity=e.target.value/100};$("#color").oninput=e=>{$("#content").style.color=e.target.value;$("#colorValue").textContent=e.target.value.toUpperCase()};document.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{pos=b.dataset.pos;cal.style.backgroundPosition=pos;document.querySelectorAll("[data-pos]").forEach(x=>x.classList.toggle("active",x===b))});$("#monday").onclick=e=>{monday=!monday;e.currentTarget.classList.toggle("on",monday);render()};function move(d){let n=new Date(year,month+d,1);year=n.getFullYear();month=n.getMonth();render()}$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);
$("#save").onclick=()=>{let cv=document.createElement("canvas");cv.width=1600;cv.height=1131;let c=cv.getContext("2d");c.fillStyle="#7e8c82";c.fillRect(0,0,1600,1131);if(img&&img.complete){let s=Math.max(1600/img.width,1131/img.height),w=img.width*s,h=img.height*s,x=(1600-w)/2,y=pos==="top"?0:pos==="bottom"?1131-h:(1131-h)/2;c.drawImage(img,x,y,w,h)}c.fillStyle=`rgba(0,0,0,${+$("#shade").value/100})`;c.fillRect(0,0,1600,1131);let color=$("#color").value;c.fillStyle=color;c.textAlign="left";c.font="600 46px sans-serif";c.fillText(year,105,118);c.font="700 112px sans-serif";c.fillText(M[month],100,225);let left=100,top=345,cw=200,ch=112,labels=monday?[...W.slice(1),W[0]]:W,cells=data();c.textAlign="center";c.font="600 27px sans-serif";labels.forEach((x,i)=>c.fillText(x,left+cw*i+cw/2,top));c.globalAlpha=.45;c.strokeStyle=color;for(let i=0;i<=7;i++){c.beginPath();c.moveTo(left+i*cw,top+30);c.lineTo(left+i*cw,top+30+Math.ceil(cells.length/7)*ch);c.stroke()}for(let i=0;i<=Math.ceil(cells.length/7);i++){c.beginPath();c.moveTo(left,top+30+i*ch);c.lineTo(left+7*cw,top+30+i*ch);c.stroke()}c.globalAlpha=1;c.textAlign="left";c.font="500 31px sans-serif";cells.forEach((d,i)=>{if(d)c.fillText(d,left+i%7*cw+22,top+75+Math.floor(i/7)*ch)});let a=document.createElement("a");a.download=`${year}-${String(month+1).padStart(2,"0")}-calendar.png`;a.href=cv.toDataURL();a.click()};$("#shadeLayer").style.opacity=.28;render();
</script></body></html>
